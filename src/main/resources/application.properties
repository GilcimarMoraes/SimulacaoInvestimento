# PostgreSQL local e o ambiente normal da aplicacao.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/simulacao-investimento}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:157157}
quarkus.datasource.devservices.enabled=false

# Schema/seed para desenvolvimento e execucao local.
# ATENCAO: drop-and-create recria as tabelas a cada start. Em producao,
# troque por Flyway/Liquibase e remova esta opcao.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Testes usam H2 em memoria para nao depender de um PostgreSQL local.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:simulacao;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.http.test-port=0

# JWT Configuration
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=caixaverso
smallrye.jwt.sign.key.location=privateKey.pem
quarkus.http.auth.permission.unauthenticated.paths=/,/auth/login,/swagger-ui/*,/q/swagger-ui/*
quarkus.http.auth.permission.unauthenticated.policy=permit
quarkus.http.auth.proactive=false