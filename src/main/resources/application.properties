# PostgreSQL local e o ambiente normal da aplicacao.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/simulacao-investimento}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:admin}
quarkus.datasource.devservices.enabled=false

# JWT Configuration
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=caixaverso
smallrye.jwt.sign.key.location=privateKey.pem
quarkus.http.auth.permission.unauthenticated.paths=/,/auth/login,/swagger-ui/*,/q/swagger-ui/*
quarkus.http.auth.permission.unauthenticated.policy=permit
quarkus.http.auth.proactive=false